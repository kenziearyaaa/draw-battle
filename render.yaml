services:
  - type: web
    name: draw-battle
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: draw-battle-db
          property: connectionString
      - key: PG_SSL
        value: "false"
databases:
  - name: draw-battle-db
    plan: basic-256mb
