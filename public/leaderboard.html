<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard — DRAW BATTLE</title><link rel="stylesheet" href="/css/style.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">✎</span> DRAW BATTLE</a><nav class="nav"><a href="/host.html" class="btn dark">START BATTLE</a></nav></header><main class="page"><div class="page-title"><div><div class="eyebrow">THE HALL OF FAME</div><h1>Leaderboard.</h1><p class="muted">Every battle counts. Every win matters.</p></div><button class="btn outline" id="refresh">↻ Refresh</button></div><div class="panel" style="padding:0;overflow:auto"><table class="leader-table"><thead><tr><th>Rank</th><th>Player</th><th>Wins</th><th>Matches</th><th>Win rate</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading leaderboard…</td></tr></tbody></table></div><p class="muted" id="leaderMessage" style="font-size:13px;margin-top:14px">Leaderboard menggunakan data pertandingan yang tersimpan di PostgreSQL.</p></main><footer class="footer"><b>DRAW BATTLE © 2026</b><span>Made for creative minds. Built to compete.</span></footer><script>
const rows=document.getElementById('rows'),msg=document.getElementById('leaderMessage');async function load(){rows.innerHTML='<tr><td colspan="5">Loading…</td></tr>';try{const r=await fetch('/api/leaderboard');const d=await r.json();if(!r.ok)throw new Error(d.error||'Tidak dapat memuat data');if(!d.rows.length){rows.innerHTML='<tr><td colspan="5">Belum ada pertandingan tersimpan. Jadilah yang pertama!</td></tr>';return}rows.innerHTML=d.rows.map((p,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td><b>${esc(p.name)}</b></td><td>${p.wins}</td><td>${p.played}</td><td>${p.win_rate}%</td></tr>`).join('');msg.textContent='Menampilkan 50 pemain teratas berdasarkan data pertandingan tersimpan.'}catch(e){rows.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;msg.textContent='Konfigurasikan PostgreSQL untuk mengaktifkan leaderboard permanen.'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('refresh').onclick=load;load();</script><script>lucide.createIcons()</script></body></html>
